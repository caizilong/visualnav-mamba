project_name: nomad
run_name: nomad_mamba

# ---------------- 训练设置 ----------------
use_wandb: True                           # 是否启用 wandb
train: True
freeze_backbone: false                     # true=冻结 DINOv3，仅训练其余模块；false=全量训练
batch_size: 128
eval_batch_size: 128                      # 评估时可以使用较小的batch_size以避免OOM
epochs: 100
gpu_ids: [0]
num_workers: 4
lr: 5e-5
use_differential_lr: false                 # 对 backbone 与其余模块使用不同学习率
backbone_lr: 5e-6                         # 仅在 use_differential_lr=true 时生效
optimizer: adamw
clipping: True
max_norm: 1.
scheduler: "cosine"
warmup: True
warmup_epochs: 5
cyclic_period: 10
plateau_patience: 3
plateau_factor: 0.5
save_epoch_checkpoints: false              # 默认只保留 latest/ema_latest，避免每轮保存大模型导致磁盘写满
save_training_state: false                 # 默认不保存包含 model+EMA+optimizer 的巨型 training_latest.pth
save_optimizer_state: false                # 默认不保存AdamW动量状态；需要完整断点恢复时再设为true
seed: 0

# ---------------- 模型参数 ----------------
model_type: nomad
vision_encoder: nomad_mamba               # 关键：使用新的 Mamba 版视觉编码器
encoding_size: 384                        # 对齐 ViT-S / DINOv3 的隐藏维度，避免额外压缩

# 视觉编码器配置（通过 timm 库支持多种 backbone）
# 支持的模型类型：
#   - EfficientNet: efficientnet-b0, efficientnet-b1, ...
#   - ResNet: resnet18, resnet50, ...
#   - ViT: vit_tiny_patch16_224, vit_small_patch16_224, ...
#   - DINOv2: vit_small_patch14_dinov2 (patch=14, 图像尺寸需能被14整除)
#   - DINOv3: vit_small_patch16_dinov3 (内部会映射到 timm 的官方权重名，patch=16，推荐)
#   - ConvNeXt: convnext_tiny, convnext_small, ...
obs_encoder: vit_small_patch16_dinov3     # 观测编码器（ViT-S / DINOv3）
goal_encoder: vit_small_patch16_dinov3    # 目标编码器类型；share_visual_backbone=true 时会实际共享主干
share_visual_backbone: false               # obs / goal 共用同一套 DINOv3 参数
use_visual_adapter: false                  # 是否启用 backbone 后的 obs/goal 轻量残差 adapter；消融实验可设为 false
adapter_hidden_dim: 96                    # 轻量 adapter 的瓶颈维度（约为 hidden size 的 1/4）
adapter_scale: 0.1                        # 小尺度残差注入

use_spatial_mamba_tokens: false           # 消融开关：false=每帧全局池化1个token；true=保留空间tokens并展平成长序列送入Mamba（DINOv3优化实验推荐true）
drop_backbone_prefix_tokens: true         # 空间token模式下丢弃ViT的CLS/register等prefix tokens，只保留patch tokens
vit_global_pool: patch_mean                 # 非空间token模式下的ViT池化：all_mean/cls/patch_mean/cls_patch_mean（DINOv3优化实验推荐patch_mean）
bidirectional_mamba: false                 # 前向/反向 Mamba 同时建模，让 goal 信息反向传播到上下文

use_goal_gate: false                       # 是否启用当前帧与 goal 的门控融合
use_goal_film: false                       # 是否启用 goal-aware FiLM 调制历史 observation tokens
use_goal_mamba_fusion: false               # 用 goal-observation 匹配特征自适应融合前向/反向 Mamba 信息流
goal_fusion_hidden_dim: 768               # 目标门控融合 MLP 的隐藏维度（= 2 * encoding_size）
goal_mamba_fusion_hidden_dim: 384         # goal-modulated bidirectional state-space fusion 的隐藏维度

use_navigation_aux: false                  # 启用导航几何辅助监督，让 DINO/adapter 学习 goal-relative affordance
nav_aux_hidden_dim: 192                   # goal_pos 辅助预测头隐藏维度
nav_goal_pos_loss_weight: 0.05            # 局部 goal 相对位置预测辅助损失权重
nav_contrastive_loss_weight: 0.01         # obs-goal 导航表征对比损失权重
nav_contrastive_temperature: 0.1
aux_negative_distance_threshold: 20
cond_predict_scale: False
mha_num_attention_layers: 4               # NoMaD_Mamba 中的 Mamba 层数
down_dims: [64, 128, 256]

# Mamba2 超参数（可选，不设置则使用 MambaConfig 默认值；对 encoding_size=384 短序列建议较小值）
# 约束条件: (encoding_size * mamba_expand) % mamba_headdim == 0
mamba_d_state: 64
mamba_d_conv: 4
mamba_expand: 2
mamba_headdim: 64
mamba_chunk_size: 256
mamba_use_mem_eff_path: true

# ---------------- 扩散模型参数 ----------------
num_diffusion_iters: 10

# ---------------- 目标 mask 相关 ----------------
goal_mask_prob: 0.3

# ---------------- 动作空间归一化 ----------------
normalize: True

# ---------------- 推理时 guidance 调度 ----------------
goal_guidance_min: 1.0                  # 早期 denoising 更接近无条件分支，鼓励探索
goal_guidance_max: 1.0                  # 后期 denoising 强化目标条件，收敛到目标导航
goal_guidance_power: 1.0                # 非线性调度，后段更快增强 goal guidance
use_adaptive_guidance: false              # 根据目标距离置信度与多样本动作不确定性动态调节 guidance
guidance_confidence_weight: 0.35         # 目标越可信，guidance 越强
guidance_uncertainty_weight: 0.25        # 动作样本越分散，guidance 越保守
guidance_distance_scale: 10.0            # 距离预测转目标置信度的指数尺度

# ---------------- 上下文设置 ----------------
context_type: temporal
context_size: 6                          # 历史帧数（temporal 上下文）
alpha: 1e-4                              # 距离损失权重

# ---------------- 距离 / 动作 标签范围 ----------------
distance:
  min_dist_cat: 0
  max_dist_cat: 20
action:
  min_dist_cat: 3
  max_dist_cat: 20

# ---------------- 动作输出配置 ----------------
len_traj_pred: 8
learn_angle: False

# ---------------- 数据集设置 ----------------
image_size: [96, 96]
datasets:
