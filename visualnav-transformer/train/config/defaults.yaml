# Default base config for NoMaD-Mamba training.
project_name: nomad
run_name: nomad_mamba

# Training setup
use_wandb: true
train: true
train_stage: finetune
freeze_backbone: false
batch_size: 64
eval_batch_size: 64
epochs: 100
gpu_ids: [0]
num_workers: 4
lr: 5e-5
optimizer: adamw
seed: 0
clipping: true
max_norm: 1.0
scheduler: cosine
warmup: true
warmup_epochs: 3
cyclic_period: 10
plateau_patience: 3
plateau_factor: 0.5

# NoMaD-Mamba only
model_type: nomad
vision_encoder: nomad_mamba
encoding_size: 384
obs_encoder: efficientnet-b0
goal_encoder: efficientnet-b0
pretrained_backbone: true
share_visual_backbone: false
adapter_hidden_dim: 96
adapter_scale: 0.1
use_spatial_mamba_tokens: false
drop_backbone_prefix_tokens: true
vit_global_pool: all_mean
bidirectional_mamba: true
use_goal_gate: true
use_goal_film: true
use_goal_mamba_fusion: true
goal_fusion_hidden_dim: 768
goal_mamba_fusion_hidden_dim: 384
use_navigation_aux: true
nav_aux_hidden_dim: 192
nav_goal_pos_loss_weight: 0.05
nav_contrastive_loss_weight: 0.01
nav_contrastive_temperature: 0.1
aux_negative_distance_threshold: 20

# Temporal encoder depth
mha_num_attention_heads: 4
mha_num_attention_layers: 4
mha_ff_dim_factor: 4

# Diffusion head
down_dims: [64, 128, 256]
cond_predict_scale: false
num_diffusion_iters: 10
goal_mask_prob: 0.5

# Mamba2 defaults
mamba_d_state: 64
mamba_d_conv: 4
mamba_expand: 2
mamba_headdim: 64
mamba_chunk_size: 256
mamba_use_mem_eff_path: true

# Differential LR
use_differential_lr: false
backbone_lr: 5e-6

# Data / labels
normalize: true
goal_type: image
context_type: temporal
context_size: 9
alpha: 1e-4

# Inference guidance
goal_guidance_min: 0.25
goal_guidance_max: 1.75
goal_guidance_power: 1.25
use_adaptive_guidance: true
guidance_confidence_weight: 0.35
guidance_uncertainty_weight: 0.25
guidance_distance_scale: 10.0

# Label ranges
distance:
  min_dist_cat: 0
  max_dist_cat: 20
action:
  min_dist_cat: 3
  max_dist_cat: 20

# Output format
len_traj_pred: 8
learn_angle: false

# Data
image_size: [96, 96]
datasets: {}

# Logging
print_log_freq: 200
image_log_freq: 0
num_images_log: 8
eval_fraction: 0.25
wandb_log_freq: 200
eval_freq: 1
