services:
  visualnav-mamba:
    build:
      context: .
      dockerfile: Dockerfile.visualnav
    image: visualnav-mamba-env:latest
    container_name: visualnav-mamba

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

    # PyTorch DataLoader 多进程需要 host IPC，否则会报共享内存不足
    ipc: host
    shm_size: "32g"

    volumes:
      - /dev/shm:/dev/shm
      - ~/visualnav-mamba:/workspace
      - /home/extra:/home/extra

    working_dir: /workspace

    tty: true
    stdin_open: true
    command: /bin/bash
